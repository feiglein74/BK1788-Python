name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm BK1788B.spec

      - name: Package
        shell: pwsh
        run: Compress-Archive -Path dist/BK1788B-Steuerung -DestinationPath BK1788B-Steuerung-windows.zip

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" BK1788B-Steuerung-windows.zip `
            --title "${{ github.ref_name }}" `
            --notes "Windows build (unzip, run BK1788B-Steuerung.exe). Changes: see CHANGELOG.md."
